<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartographie des compétences — Synapses</title>
<style>
:root{
  --bg:#0d1112;--panel:#12191b;--panel2:#182124;--paper:#ded4b7;--text:#d8d1b8;
  --muted:#91a6aa;--gold:#b7975c;--line:rgba(160,170,170,.28);
  --lecture:#c66b43;--ecriture:#3e9c8c;--oral:#8160a5;--vocab:#c99a27;
  --math:#c66b43;--geo:#8160a5;--data:#c99a27;--emc:#668394;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:Georgia,"Times New Roman",serif}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
canvas.dragging{cursor:grabbing}
header{
 position:absolute;left:0;right:0;top:0;z-index:10;text-align:center;padding:17px 20px 13px;
 background:linear-gradient(rgba(13,17,18,.96),rgba(13,17,18,.78),transparent);
 pointer-events:none
}
h1{margin:0;font-size:clamp(20px,3vw,30px);letter-spacing:3px;font-weight:normal;text-transform:uppercase}
.subtitle{margin-top:5px;color:var(--muted);font-size:12px;letter-spacing:.7px}
.toolbar{
 position:absolute;left:10px;right:10px;top:82px;z-index:11;display:flex;gap:7px;align-items:center;
 flex-wrap:wrap;padding:8px;background:rgba(18,25,27,.88);border:1px solid var(--line);backdrop-filter:blur(5px)
}
.group{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
button,input{
 border:1px solid var(--line);background:#11181a;color:var(--text);padding:6px 9px;font:12px Georgia,serif
}
button{cursor:pointer}
button.active{border-color:var(--gold);background:rgba(183,151,92,.16);color:var(--paper)}
input{width:230px}
#status{margin-left:auto;color:var(--muted);font-size:11px}
#error{
 display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
 width:min(650px,90vw);padding:22px;background:rgba(18,25,27,.97);border:1px solid #8c5548;
 box-shadow:0 20px 70px #000;color:var(--text)
}
#error h2{margin:0 0 10px;color:#d99b84;font-size:18px}
#error pre{white-space:pre-wrap;font:12px/1.5 Consolas,monospace;color:#c9c2ab}
#help{
 position:absolute;left:12px;bottom:12px;z-index:10;padding:10px 12px;background:rgba(18,25,27,.88);
 border:1px solid var(--line);font-size:11px;color:var(--muted)
}
#legend{
 position:absolute;right:12px;bottom:12px;z-index:10;padding:11px 13px;background:rgba(18,25,27,.9);
 border:1px solid var(--line);font-size:11px
}
.legendrow{display:flex;align-items:center;gap:7px;margin:4px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#panel{
 position:absolute;right:0;top:0;bottom:0;width:min(430px,94vw);z-index:30;padding:22px;
 background:rgba(13,18,20,.97);border-left:1px solid var(--line);overflow:auto;
 transform:translateX(105%);transition:.22s ease
}
#panel.open{transform:translateX(0)}
.close{float:right;cursor:pointer;color:var(--muted);font-size:18px}
.tag{display:inline-block;border:1px solid var(--gold);padding:3px 7px;color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:1px}
#panel h2{font-size:21px;font-weight:normal;color:var(--paper);margin:8px 30px 8px 0}
.meta{color:var(--muted);font-size:11px;margin-bottom:14px}
.section{margin:16px 0}
.section h3{font-size:13px;color:var(--paper);font-weight:normal;letter-spacing:.5px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.card{border:1px solid var(--line);border-left:3px solid var(--gold);padding:9px;margin:7px 0;background:rgba(222,212,183,.04)}
.card b{color:var(--paper)}
a{color:var(--gold);cursor:pointer}
@media(max-width:720px){
 .toolbar{top:76px}.toolbar input{width:170px}#status{width:100%;margin-left:0}
 #legend{display:none}#help{bottom:8px;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
<canvas id="graph"></canvas>

<header>
  <h1>Cartographie des compétences</h1>
  <div class="subtitle" id="subtitle">Chargement de l'index pédagogique…</div>
</header>

<div class="toolbar">
  <div class="group"><span class="label">Niveaux</span><div id="levels"></div></div>
  <div class="group"><span class="label">Domaines</span><div id="domains"></div></div>
  <input id="search" placeholder="Rechercher compétence, séquence, séance…">
  <button id="reset">Réinitialiser</button>
  <span id="status">Chargement…</span>
</div>

<div id="legend">
  <div class="legendrow"><span class="dot" style="background:#63c58c"></span>Compétence</div>
  <div class="legendrow"><span class="dot" style="background:#d7a84b"></span>Séquence</div>
  <div class="legendrow"><span class="dot" style="background:#62b7df"></span>Séance</div>
  <div class="legendrow"><span class="dot" style="background:#b7975c"></span>Prérequis</div>
</div>

<div id="help">Glisser pour tourner · Molette pour zoomer · Cliquer sur un nœud pour ouvrir sa fiche</div>
<div id="error"><h2>Impossible de construire la cartographie</h2><pre id="errorText"></pre></div>

<aside id="panel">
  <span class="close" id="close">✕</span>
  <div id="panelContent"></div>
</aside>
</div>

<script>
"use strict";

/*
  CARTOGRAPHIE DES COMPÉTENCES — SYNAPSES
  ------------------------------------------------------------
  Source unique de structure :
      Programmation/data/index.json

  Référentiel :
      Programmation/data/competences.json

  IMPORTANT :
  - index.json est la porte d'entrée du site.
  - Les chemins déclarés dans index.json sont relatifs à Programmation/.
  - Les séances sont reliées aux séquences par sequence_id.
  - Les compétences possèdent des prérequis par ID.
  - Certaines séquences utilisent actuellement un competence_id qui
    n'existe pas encore comme ID dans competences.json (ex. lecture_code).
    La cartographie gère ces alias sans modifier les données.
*/

const ROOT="./Programmation/";
const $=id=>document.getElementById(id);

const state={
 index:null,competences:[],sequences:[],seances:[],
 levels:new Set(),domains:new Set(),search:"",
 nodes:[],links:[],selected:null,hover:null,
 yaw:.25,pitch:-.15,zoom:1,drag:false,lastX:0,lastY:0,
 animation:0
};

const DOMAIN_COLORS={
 lecture:"#c66b43",ecriture:"#3e9c8c",oral:"#8160a5",vocabulaire:"#c99a27",
 grammaire_orthographe:"#334c8d",nombres_calcul_problemes:"#c66b43",
 grandeurs_mesures:"#3e9c8c",espace_geometrie:"#8160a5",
 organisation_donnees:"#c99a27",enseignement_moral_civique:"#668394"
};

/* Les données existantes contiennent quelques anciens identifiants.
   Cette table est volontairement petite et explicite. */
const COMPETENCE_ALIASES={
  "lecture_code":"lecture_identifier_mots"
};

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function niveauLabel(v){
 const s=String(v??"").trim();
 const m={cp:"CP",ce1:"CE1",ce2:"CE2",cm1:"CM1",cm2:"CM2"};
 return m[s.toLowerCase()]||s;
}

function normalizePath(p){
 return String(p||"").replace(/^\.?\//,"");
}

function dataUrl(relative){
 return ROOT+normalizePath(relative);
}

async function getJSON(url){
 const r=await fetch(url,{cache:"no-cache"});
 if(!r.ok) throw new Error(`HTTP ${r.status} — ${url}`);
 return await r.json();
}

function setStatus(t){$("status").textContent=t}

function showError(e){
 console.error(e);
 $("error").style.display="block";
 $("errorText").textContent=(e&&e.stack)||String(e);
 setStatus("Erreur de chargement");
}

/* ---------- COMPÉTENCES ---------- */

function competenceById(id){
 return state.competences.find(c=>c.id===id);
}

function resolveCompetenceId(rawId){
 if(!rawId)return null;
 if(competenceById(rawId))return rawId;
 if(COMPETENCE_ALIASES[rawId] && competenceById(COMPETENCE_ALIASES[rawId]))
   return COMPETENCE_ALIASES[rawId];
 return null;
}

/*
  Fallback prudent pour les anciennes séquences dont competence_id
  n'est pas encore harmonisé.
  On ne fabrique pas une relation à partir de rien :
  on cherche d'abord le domaine/niveau, puis les mots communs.
*/
function inferCompetence(sequence){
 const exact=resolveCompetenceId(sequence.competence_id);
 if(exact)return exact;

 const pool=state.competences.filter(c=>
   String(c.niveau||"").toLowerCase()===String(sequence.classe||"").toLowerCase() &&
   (!sequence.domaine || String(c.domaine||"").toLowerCase().includes(
      String(sequence.domaine).split("-").pop().trim().toLowerCase()
   ))
 );

 const text=[
   sequence.titre,sequence.competences,sequence.objectif_commun,
   ...(sequence.prerequis_competences||[])
 ].join(" ").toLowerCase();

 let best=null,score=0;
 for(const c of pool){
   const words=[
     c.intitule,...(c.mots_cles||[]),...(c.objectifs||[])
   ].join(" ").toLowerCase().split(/[^a-zàâäéèêëîïôöùûüÿçœæ0-9]+/i)
    .filter(w=>w.length>=4);
   const unique=[...new Set(words)];
   let s=0;
   for(const w of unique)if(text.includes(w))s++;
   if(s>score){score=s;best=c.id}
 }
 return score>=2?best:null;
}

/* ---------- INDEX ---------- */

function flattenIndex(index){
 const seqs=[],seas=[];
 for(const niveau of (index.niveaux||[])){
   for(const discipline of (niveau.disciplines||[])){
     for(const domaine of (discipline.domaines||[])){
       for(const s of (domaine.sequences||[])){
         seqs.push({
           ...s,
           niveau:niveau.id,
           niveau_nom:niveau.nom,
           discipline_id:discipline.id,
           discipline:discipline.nom,
           domaine_id:domaine.id,
           domaine:domaine.nom,
           _indexPath:s.fichier_sequence||s.fichier||null
         });
         for(const se of (s.seances||[])){
           seas.push({
             ...se,
             niveau:niveau.id,
             discipline:discipline.nom,
             domaine_id:domaine.id,
             domaine:domaine.nom,
             sequence_id:s.id,
             sequence_titre:s.titre,
             _indexPath:se.fichier||null
           });
         }
       }
     }
   }
 }
 return {seqs,seas};
}

async function enrichSequences(seqs){
 let count=0;
 await Promise.all(seqs.map(async s=>{
   if(!s._indexPath)return;
   try{
     const raw=await getJSON(dataUrl(s._indexPath));
     const obj=Array.isArray(raw?.sequences)?raw.sequences[0]:raw;
     if(obj&&typeof obj==="object")Object.assign(s,obj);
   }catch(e){
     console.warn("Séquence non chargée :",s.id,e);
   }
   count++;
   setStatus(`Lecture des séquences… ${count}/${seqs.length}`);
 }));
}

async function enrichSessions(seas){
 let count=0;
 await Promise.all(seas.map(async s=>{
   if(!s._indexPath)return;
   try{
     const raw=await getJSON(dataUrl(s._indexPath));
     if(raw&&typeof raw==="object")Object.assign(s,raw);
   }catch(e){
     console.warn("Séance non chargée :",s.id,e);
   }
   count++;
 }));
}

async function load(){
 try{
   setStatus("Lecture de l'index…");
   state.index=await getJSON(ROOT+"data/index.json");

   const compPath=state.index?.meta?.competences||"data/competences.json";
   setStatus("Lecture du référentiel…");
   const compRaw=await getJSON(dataUrl(compPath));
   state.competences=Array.isArray(compRaw)?compRaw:(compRaw.competences||[]);

   const flat=flattenIndex(state.index);
   state.sequences=flat.seqs;
   state.seances=flat.seas;

   state.levels=new Set((state.index.niveaux||[]).map(n=>n.id));
   state.domains=new Set(state.competences.map(c=>c.domaine_id).filter(Boolean));

   await enrichSequences(state.sequences);
   await enrichSessions(state.seances);

   buildNodes();
   renderFilters();
   render();
   updateSubtitle();

   setStatus(`${state.nodes.length} nœuds · ${state.links.length} relations`);
 }catch(e){showError(e)}
}

/* ---------- GRAPHE ---------- */

function nodeVisible(n){
 if(n.niveau && !state.levels.has(n.niveau))return false;
 if(n.domaine_id && !state.domains.has(n.domaine_id))return false;
 if(!state.search)return true;

 const q=state.search.toLowerCase();
 return [
   n.id,n.label,n.type,n.domaine,n.discipline,n.niveau,n.titre,
   n.description
 ].join(" ").toLowerCase().includes(q);
}

function buildNodes(){
 state.nodes=[];state.links=[];

 /* niveaux = espaces de regroupement, pas des nœuds pédagogiques */
 const levels=[...state.levels];
 const levelIndex={};
 levels.forEach((id,i)=>levelIndex[id]=i);

 /* Compétences */
 for(const c of state.competences){
   const n={
     id:"c:"+c.id,type:"competence",ref:c.id,label:c.intitule||c.nom||c.id,
     niveau:c.niveau,domaine_id:c.domaine_id,domaine:c.domaine,
     color:c.couleur||DOMAIN_COLORS[c.domaine_id]||"#63c58c"
   };
   state.nodes.push(n);

   for(const p of (c.prerequis_competences||[])){
     const pid=resolveCompetenceId(p);
     if(pid)state.links.push({source:"c:"+pid,target:n.id,type:"prerequis"});
   }
 }

 /* Séquences */
 for(const s of state.sequences){
   const sid="s:"+s.id;
   const compId=resolveCompetenceId(s.competence_id)||inferCompetence(s);

   state.nodes.push({
     id:sid,type:"sequence",ref:s.id,label:s.titre||s.id,titre:s.titre,
     niveau:s.niveau,classe:s.classe||s.niveau,domaine_id:s.domaine_id,
     domaine:s.domaine,discipline:s.discipline,competenceId:compId,
     color:"#d7a84b"
   });

   if(compId){
     state.links.push({source:"c:"+compId,target:sid,type:"sequence"});
   }

   for(const p of (s.prerequis_competences||[])){
     /* Ce sont actuellement des libellés libres, pas des IDs.
        On les conserve dans la fiche, mais on ne les transforme
        pas artificiellement en arêtes. */
   }
 }

 /* Séances */
 for(const s of state.seances){
   const sid="a:"+s.id;
   state.nodes.push({
     id:sid,type:"seance",ref:s.id,label:s.titre||s.id,titre:s.titre,
     numero:s.numero,niveau:s.niveau||s.classe,domaine_id:s.domaine_id,
     domaine:s.domaine,discipline:s.discipline,sequenceId:s.sequence_id,
     color:"#62b7df"
   });
   if(s.sequence_id){
     state.links.push({source:"s:"+s.sequence_id,target:sid,type:"seance"});
   }
 }

 /* Coordonnées de départ : niveaux en profondeur, compétences au centre,
    séquences autour, séances en périphérie. */
 const comps=state.nodes.filter(n=>n.type==="competence");
 const seqs=state.nodes.filter(n=>n.type==="sequence");
 const seas=state.nodes.filter(n=>n.type==="seance");

 for(const n of comps){
   const idx=Math.max(0,levelIndex[n.niveau]??0);
   const arr=comps.filter(x=>x.niveau===n.niveau);
   const i=Math.max(0,arr.indexOf(n));
   const a=i/Math.max(1,arr.length)*Math.PI*2;
   n.x=Math.cos(a)*150;n.y=Math.sin(a)*90;n.z=(idx-(levels.length-1)/2)*230;
 }

 for(const n of seqs){
   const c=comps.find(x=>x.ref===n.competenceId);
   const arr=seqs.filter(x=>x.competenceId===n.competenceId);
   const i=Math.max(0,arr.indexOf(n));
   const a=i/Math.max(1,arr.length)*Math.PI*2;
   n.x=(c?.x||0)+Math.cos(a)*90;
   n.y=(c?.y||0)+Math.sin(a)*70;
   n.z=(c?.z||0)+Math.sin(a*.7)*35;
 }

 for(const n of seas){
   const s=seqs.find(x=>x.ref===n.sequenceId);
   const arr=seas.filter(x=>x.sequenceId===n.sequenceId);
   const i=Math.max(0,arr.indexOf(n));
   const a=i/Math.max(1,arr.length)*Math.PI*2;
   n.x=(s?.x||0)+Math.cos(a)*55;
   n.y=(s?.y||0)+Math.sin(a)*45;
   n.z=(s?.z||0)+Math.cos(a)*30;
 }
}

/* ---------- PROJECTION 3D NATIVE : aucune bibliothèque externe ---------- */

function rotate(n){
 const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw);
 const cp=Math.cos(state.pitch),sp=Math.sin(state.pitch);
 const x=n.x*cy-n.z*sy;
 const z=n.x*sy+n.z*cy;
 const y=n.y*cp-z*sp;
 const zz=n.y*sp+z*cp;
 return {x,y,z:zz};
}

function project(n){
 const r=rotate(n);
 const d=620;
 const scale=(d/(d+r.z))*state.zoom;
 return {
   x:innerWidth/2+r.x*scale,
   y:innerHeight/2+r.y*scale,
   z:r.z,
   scale
 };
}

function visibleNodes(){return state.nodes.filter(nodeVisible)}
function visibleLinks(){
 const set=new Set(visibleNodes().map(n=>n.id));
 return state.links.filter(l=>set.has(l.source)&&set.has(l.target));
}

function drawLevelBackdrops(ctx){
 const levels=[...state.levels];
 levels.forEach((lv,i)=>{
   const z=(i-(levels.length-1)/2)*230;
   const fake={x:0,y:0,z};
   const p=project(fake);
   const r=290*p.scale;
   ctx.save();
   ctx.strokeStyle="rgba(183,151,92,.25)";
   ctx.lineWidth=1.5;
   ctx.beginPath();
   ctx.ellipse(p.x,p.y,r,r*.55,0,0,Math.PI*2);
   ctx.stroke();
   ctx.fillStyle="rgba(222,212,183,.8)";
   ctx.font="20px Georgia";
   ctx.textAlign="center";
   ctx.fillText(niveauLabel(lv),p.x,p.y-r*.62);
   ctx.restore();
 });
}

function draw(){
 const c=$("graph"),ctx=c.getContext("2d");
 c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 ctx.clearRect(0,0,innerWidth,innerHeight);

 const bg=ctx.createRadialGradient(innerWidth*.5,innerHeight*.35,10,innerWidth*.5,innerHeight*.5,innerWidth);
 bg.addColorStop(0,"#182124");bg.addColorStop(1,"#080b0c");
 ctx.fillStyle=bg;ctx.fillRect(0,0,innerWidth,innerHeight);

 drawLevelBackdrops(ctx);

 const ps=new Map();
 for(const n of visibleNodes())ps.set(n.id,project(n));

 /* liens */
 for(const l of visibleLinks()){
   const a=ps.get(l.source),b=ps.get(l.target);if(!a||!b)continue;
   ctx.save();
   ctx.strokeStyle=l.type==="prerequis"?"#b7975c":l.type==="sequence"?"rgba(215,168,75,.7)":"rgba(98,183,223,.58)";
   ctx.lineWidth=l.type==="prerequis"?1.4:1;
   if(l.type==="prerequis")ctx.setLineDash([4,5]);
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   ctx.restore();
 }

 /* nœuds du fond vers l'avant */
 const sorted=visibleNodes().slice().sort((a,b)=>ps.get(a.id).z-ps.get(b.id).z);
 for(const n of sorted){
   const p=ps.get(n.id);
   const selected=state.selected===n.id;
   const hovered=state.hover===n.id;
   const base=n.type==="competence"?11:n.type==="sequence"?8:4.8;
   const r=base*p.scale*(selected?1.35:1);
   ctx.save();
   if(selected||hovered){
     ctx.shadowBlur=18;ctx.shadowColor=n.color;
   }
   const g=ctx.createRadialGradient(p.x-r*.4,p.y-r*.5,r*.1,p.x,p.y,r);
   g.addColorStop(0,"#ffffff");g.addColorStop(.22,n.color);g.addColorStop(1,"#101516");
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,r),0,Math.PI*2);ctx.fill();
   ctx.strokeStyle=selected?"#fff":n.color;ctx.lineWidth=selected?2:1;ctx.stroke();

   if(n.type!=="seance" || p.scale>.85 || hovered || selected){
     ctx.shadowBlur=0;ctx.fillStyle=selected?"#fff":"#d8d1b8";
     ctx.font=(n.type==="competence"?"12px":"10px")+" Georgia";
     ctx.textAlign="center";
     ctx.fillText(n.label.length>34?n.label.slice(0,33)+"…":n.label,p.x,p.y+r+14);
   }
   ctx.restore();
 }

 state.animation=requestAnimationFrame(draw);
}

/* ---------- INTERACTION ---------- */

function hit(x,y){
 let best=null,dist=Infinity;
 for(const n of visibleNodes()){
   const p=project(n),r=Math.max(7,(n.type==="competence"?11:n.type==="sequence"?8:5)*p.scale);
   const d=Math.hypot(x-p.x,y-p.y);
   if(d<r+7&&d<dist){dist=d;best=n}
 }
 return best;
}

$("graph").addEventListener("pointerdown",e=>{
 state.drag=true;state.lastX=e.clientX;state.lastY=e.clientY;
 $("graph").classList.add("dragging");
});
window.addEventListener("pointerup",e=>{
 if(state.drag){
   const dx=Math.abs(e.clientX-state.lastX),dy=Math.abs(e.clientY-state.lastY);
   state.drag=false;$("graph").classList.remove("dragging");
   if(dx<4&&dy<4){
     const n=hit(e.clientX,e.clientY);
     if(n)openNode(n);
   }
 }
});
window.addEventListener("pointermove",e=>{
 if(state.drag){
   state.yaw+=(e.clientX-state.lastX)*.008;
   state.pitch+=(e.clientY-state.lastY)*.006;
   state.pitch=Math.max(-1.25,Math.min(1.25,state.pitch));
   state.lastX=e.clientX;state.lastY=e.clientY;
 }else{
   const n=hit(e.clientX,e.clientY);state.hover=n?.id||null;
 }
});
$("graph").addEventListener("wheel",e=>{
 e.preventDefault();state.zoom*=e.deltaY<0?1.08:.92;state.zoom=Math.max(.35,Math.min(3.5,state.zoom));
},{passive:false});

/* ---------- FILTRES ---------- */

function renderFilters(){
 $("levels").innerHTML="";
 const levels=state.index?.niveaux||[];
 for(const l of levels){
   const b=document.createElement("button");b.textContent=niveauLabel(l.id);
   b.className=state.levels.has(l.id)?"active":"";
   b.onclick=()=>{
     if(state.levels.has(l.id)){
       if(state.levels.size>1)state.levels.delete(l.id);
     }else state.levels.add(l.id);
     renderFilters();updateSubtitle();
   };
   $("levels").appendChild(b);
 }

 $("domains").innerHTML="";
 const seen=new Set();
 for(const c of state.competences){
   if(!c.domaine_id||seen.has(c.domaine_id))continue;
   seen.add(c.domaine_id);
   const b=document.createElement("button");
   b.textContent=c.domaine||c.domaine_id;
   b.className=state.domains.has(c.domaine_id)?"active":"";
   b.onclick=()=>{
     if(state.domains.has(c.domaine_id))state.domains.delete(c.domaine_id);
     else state.domains.add(c.domaine_id);
     renderFilters();updateSubtitle();
   };
   $("domains").appendChild(b);
 }
}

function updateSubtitle(){
 const n=visibleNodes();
 const c=n.filter(x=>x.type==="competence").length;
 const s=n.filter(x=>x.type==="sequence").length;
 const a=n.filter(x=>x.type==="seance").length;
 $("subtitle").textContent=
   `${[...state.levels].map(niveauLabel).join(" · ")} · ${c} compétences · ${s} séquences · ${a} séances`;
}

$("search").addEventListener("input",e=>{
 state.search=e.target.value.trim();updateSubtitle();
});

$("reset").onclick=()=>{
 state.search="";
 $("search").value="";
 state.levels=new Set((state.index?.niveaux||[]).map(n=>n.id));
 state.domains=new Set(state.competences.map(c=>c.domaine_id).filter(Boolean));
 renderFilters();updateSubtitle();
};

/* ---------- FICHES ---------- */

function openNode(n){
 state.selected=n.id;
 const p=$("panelContent");

 if(n.type==="competence"){
   const c=competenceById(n.ref);
   const prereqs=(c?.prerequis_competences||[]).map(resolveCompetenceId).filter(Boolean);
   const seqs=state.sequences.filter(s=>
     (resolveCompetenceId(s.competence_id)||inferCompetence(s))===n.ref
   );

   p.innerHTML=`
    <span class="tag">${esc(c?.domaine||n.domaine||"Compétence")}</span>
    <h2>${esc(c?.intitule||n.label)}</h2>
    <div class="meta">Niveau : ${esc(niveauLabel(c?.niveau||n.niveau))}</div>
    <div class="section"><h3>Objectifs</h3>
      ${(c?.objectifs||[]).map(x=>`<div class="card">${esc(x)}</div>`).join("")||"<div class=\"card\">Aucun objectif renseigné.</div>"}
    </div>
    <div class="section"><h3>Prérequis</h3>
      ${prereqs.length?prereqs.map(id=>{
        const x=competenceById(id);
        return `<div class="card"><a data-open="c:${id}">${esc(x?.intitule||id)}</a></div>`
      }).join(""):"<div class=\"card\">Aucun prérequis par ID.</div>"}
    </div>
    <div class="section"><h3>Séquences rattachées</h3>
      ${seqs.length?seqs.map(s=>`<div class="card"><a data-open="s:${esc(s.id)}">${esc(s.titre||s.id)}</a></div>`).join("")
      :"<div class=\"card\">Aucune séquence reliée par un identifiant compatible.</div>"}
    </div>`;
 }
 else if(n.type==="sequence"){
   const s=state.sequences.find(x=>x.id===n.ref);
   const linked=n.competenceId?competenceById(n.competenceId):null;
   const sessions=state.seances.filter(x=>x.sequence_id===n.ref);
   p.innerHTML=`
    <span class="tag">${esc(s?.domaine||n.domaine||"Séquence")}</span>
    <h2>${esc(s?.titre||n.label)}</h2>
    <div class="meta">Niveau : ${esc(niveauLabel(s?.classe||s?.niveau||n.niveau))} · Période ${esc(s?.periode??"—")}</div>
    <div class="section"><h3>Compétence</h3>
      <div class="card">${linked?`<a data-open="c:${esc(linked.id)}">${esc(linked.intitule)}</a>`:"Identifiant de compétence non harmonisé"}</div>
    </div>
    <div class="section"><h3>Prérequis de la séquence</h3>
      ${(s?.prerequis||s?.prerequis_competences||[]).map(x=>`<div class="card">${esc(typeof x==="string"?x:JSON.stringify(x))}</div>`).join("")||"<div class=\"card\">Aucun prérequis renseigné.</div>"}
    </div>
    <div class="section"><h3>Séances</h3>
      ${sessions.map(x=>`<div class="card"><b>Séance ${esc(x.numero)}</b> — ${esc(x.titre||x.id)}</div>`).join("")||"<div class=\"card\">Aucune séance.</div>"}
    </div>
    <div class="section"><a href="Programmation/sequences.html?sequence=${encodeURIComponent(n.ref)}">→ Ouvrir cette séquence dans Séquences</a></div>`;
 }
 else{
   const s=state.seances.find(x=>x.id===n.ref);
   p.innerHTML=`
    <span class="tag">Séance ${esc(s?.numero||n.numero||"")}</span>
    <h2>${esc(s?.titre||n.label)}</h2>
    <div class="meta">${esc(niveauLabel(s?.classe||s?.niveau||n.niveau))} · ${esc(s?.type||"")}</div>
    <div class="section"><h3>Compétence ciblée</h3>
      <div class="card">${esc(s?.competence_cible||"Non renseignée")}</div>
    </div>
    <div class="section"><h3>Objectif commun</h3>
      <div class="card">${esc(s?.objectif_commun||"Non renseigné")}</div>
    </div>
    <div class="section"><h3>Accès</h3>
      <a href="Programmation/sequences.html?sequence=${encodeURIComponent(s?.sequence_id||"")}">→ Ouvrir la séquence correspondante</a>
    </div>`;
 }
 $("panel").classList.add("open");

 p.querySelectorAll("[data-open]").forEach(a=>{
   a.onclick=()=>{
     const x=state.nodes.find(n=>n.id===a.dataset.open);
     if(x)openNode(x);
   };
 });
}

$("close").onclick=()=>{$("panel").classList.remove("open");state.selected=null};

window.addEventListener("resize",draw);

load().then(()=>draw());
</script>
</body>
</html>
