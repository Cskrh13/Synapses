<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie des compétences — Programmation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#0d1112;--bleu-noir:#171e20;--bleu-ardoise:#2d393d;
  --parchemin:#ded4b7;--texte:#d8d1b8;--argent:#91a6aa;
  --ligne:rgba(125,139,140,.45);--or:#b7975c;--rouge:#c97b4a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#202a2c 0%,var(--fond) 62%);color:var(--texte);font-family:"Vollkorn",Georgia,serif;overflow:hidden}
header{position:relative;z-index:10;padding:16px 22px 12px;background:linear-gradient(rgba(13,17,18,.98),rgba(13,17,18,.78),transparent);border-bottom:1px solid var(--ligne)}
h1{margin:0;font-family:"IM Fell English SC",Georgia,serif;font-weight:normal;letter-spacing:2px;color:var(--parchemin);font-size:clamp(20px,3vw,30px)}
header p{margin:5px 0 0;color:var(--argent);font-size:12px;letter-spacing:.7px}
.toolbar{position:relative;z-index:10;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 14px;background:rgba(23,30,32,.94);border-bottom:1px solid var(--ligne)}
button,.chip,input{font:inherit}
button,.chip{border:1px solid var(--ligne);background:rgba(222,212,183,.04);color:var(--texte);padding:6px 9px;cursor:pointer}
button:hover,.chip:hover{background:rgba(183,151,92,.12)}
.chip.active{border-color:var(--or);background:rgba(183,151,92,.16);color:var(--parchemin)}
input{width:220px;padding:7px 10px;background:#101618;color:var(--texte);border:1px solid var(--ligne);outline:none}
.status{margin-left:auto;color:var(--argent);font-size:11px;white-space:nowrap}
#graph{position:absolute;inset:0;top:112px}
.legend{position:absolute;left:14px;bottom:14px;z-index:7;max-width:240px;padding:11px 13px;background:rgba(15,20,21,.9);border:1px solid var(--ligne);font-size:11px}
.legend h3{margin:0 0 8px;font:normal 13px "IM Fell English SC",Georgia,serif;color:var(--parchemin)}
.legend-row{display:flex;gap:7px;align-items:center;margin:4px 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.legend-line{width:22px;height:0;border-top:2px solid var(--or)}
.panel{position:absolute;right:0;top:0;bottom:0;z-index:20;width:430px;max-width:94vw;background:rgba(13,17,18,.98);border-left:1px solid var(--ligne);transform:translateX(100%);transition:transform .22s ease;overflow:auto;padding:20px}
.panel.open{transform:translateX(0)}
.close{position:absolute;right:15px;top:12px;background:none;border:0;color:var(--argent);font-size:18px}
.tag{display:inline-block;padding:3px 7px;border:1px solid var(--ligne);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.panel h2{margin:4px 30px 8px 0;font:normal 21px "IM Fell English SC",Georgia,serif;color:var(--parchemin);line-height:1.25}
.panel h3{font:normal 14px "IM Fell English SC",Georgia,serif;color:var(--parchemin);margin:20px 0 8px}
.panel p,.panel li{font-size:12.5px;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{padding:9px;background:rgba(222,212,183,.045);border:1px solid var(--ligne);text-align:center}
.stat b{display:block;font-size:17px;color:var(--parchemin)}
.stat span{font-size:10px;color:var(--argent)}
.item{padding:9px 10px;margin:6px 0;border:1px solid var(--ligne);background:rgba(222,212,183,.035);cursor:pointer}
.item:hover{border-color:var(--or)}
.item small{display:block;color:var(--argent);font-size:10px;margin-top:2px}
.seance{padding:8px 9px;margin:5px 0;border-left:3px solid var(--or);background:rgba(222,212,183,.04)}
.seance b{font-size:12px;color:var(--parchemin)}
.seance small{display:block;color:var(--argent);font-size:10.5px;margin-top:3px}
#loading{position:absolute;inset:112px 0 0;display:flex;align-items:center;justify-content:center;z-index:5;color:var(--argent);pointer-events:none}
.error{color:#e6a58b}
.empty{padding:30px;text-align:center;color:var(--argent)}
@media(max-width:720px){.status{width:100%;margin-left:0}.toolbar{padding-bottom:11px}input{width:100%}.panel{width:100%}.legend{display:none}#graph{top:156px}#loading{top:156px}}
</style>
</head>
<body>

<header>
  <h1>Cartographie des compétences</h1>
  <p id="subtitle">Compétences · séquences · séances · prérequis — toutes les données de la programmation</p>
</header>

<div class="toolbar" id="toolbar">
  <div id="domainFilters"></div>
  <input id="search" placeholder="Rechercher une compétence, séquence ou séance…">
  <button id="reset">Réinitialiser</button>
  <span class="status" id="status">Chargement…</span>
</div>

<div id="loading">Chargement de la base pédagogique…</div>
<div id="graph"></div>

<div class="legend">
  <h3>Légende</h3>
  <div id="legendRows"></div>
  <div class="legend-row"><span class="legend-line"></span> Prérequis</div>
  <div class="legend-row">→ Compétence → séquence → séance</div>
</div>

<aside class="panel" id="panel">
  <button class="close" id="close">✕</button>
  <div id="panelContent"></div>
</aside>

<script src="https://unpkg.com/3d-force-graph@1"></script>
<script>
"use strict";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

const COLORS=[
  "#c97b4a","#e0c14b","#5c9c8f","#6b8fc9","#a56bc9",
  "#b85c7a","#8eaa64","#8c78b5","#b17d4c","#4d9aa8"
];

const state={
  index:null,
  data:{domaines:[],competences:[]},
  sequences:[],
  seances:[],
  nodes:[],
  links:[],
  graph:null,
  domains:new Set(),
  search:""
};

/* =========================================================
   CHEMINS
   ---------------------------------------------------------
   Le fichier peut être placé :
   - dans /Programmation/  -> ./data/index.json
   - à la racine du site    -> ./Programmation/data/index.json
   ========================================================= */
const inProgrammation=/\/Programmation\//i.test(location.pathname);
const BASE=inProgrammation?"./":"./Programmation/";
const DATA_INDEX=BASE+"data/index.json";

function dataURL(path){
  if(!path)return "";
  /* Les chemins de index.json sont relatifs à /Programmation/. */
  return new URL(path,location.origin+location.pathname.replace(/[^/]*$/,"")+BASE).href;
}

async function fetchJSON(path){
  const url=dataURL(path);
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error(`${r.status} — ${url}`);
  return r.json();
}

function sequenceList(data){
  if(!data)return[];
  if(Array.isArray(data.sequences))return data.sequences.filter(Boolean);
  if(data.sequence&&typeof data.sequence==="object")return[data.sequence];
  if(data.id&&(data.titre||data.nom))return[data];
  return[];
}

function seanceList(data){
  if(!data)return[];
  if(Array.isArray(data.seances))return data.seances.filter(Boolean);
  if(Array.isArray(data))return data.filter(Boolean);
  if(data.seance&&typeof data.seance==="object")return[data.seance];
  if(data.id&&(data.titre||data.numero))return[data];
  return[];
}

function getCompetence(id){
  if(!id)return null;
  const aliases={
    lecture_code:"lecture_identifier_mots",
    grammaire:"grammaire_orthographe"
  };
  const wanted=aliases[id]||id;
  return state.data.competences.find(c=>c.id===wanted)||null;
}

function getDomain(id){
  return state.data.domaines.find(d=>d.id===id)||
    {id:id||"autre",nom:id||"Autre",couleur:"#7f8c8d"};
}

function domainOf(c){
  return c?.domaine_id||c?.domaine||c?.domaineId||"autre";
}

function competenceIdOf(seq){
  return seq?.competence_id||seq?.competenceId||seq?.competence||"";
}

/* =========================================================
   CHARGEMENT COMPLET
   ========================================================= */
async function loadAll(){
  setStatus("1/3 — index");
  state.index=await fetchJSON("data/index.json");

  const competencePath=state.index?.meta?.competences||"data/competences.json";
  setStatus("2/3 — compétences");
  state.data=await fetchJSON(competencePath);
  if(!Array.isArray(state.data.competences))state.data.competences=[];
  if(!Array.isArray(state.data.domaines))state.data.domaines=[];

  state.domains=new Set(state.data.domaines.map(d=>d.id));

  const entries=[];
  for(const niveau of state.index.niveaux||[]){
    for(const discipline of niveau.disciplines||[]){
      for(const domaine of discipline.domaines||[]){
        for(const meta of domaine.sequences||[]){
          entries.push({niveau,discipline,domaine,meta});
        }
      }
    }
  }

  setStatus(`3/3 — ${entries.length} séquence(s)`);
  const sequences=[];
  const seances=[];
  const errors=[];

  await Promise.all(entries.map(async entry=>{
    try{
      const raw=await fetchJSON(entry.meta.fichier_sequence);
      const list=sequenceList(raw);

      for(const original of list){
        const seq={
          ...original,
          id:original.id||entry.meta.id,
          titre:original.titre||original.nom||entry.meta.titre||entry.meta.id,
          classe:original.classe||entry.niveau.id||"",
          niveau:original.niveau||entry.niveau.id||"",
          discipline:original.discipline||entry.discipline.id||entry.discipline.nom||"",
          domaine:original.domaine||entry.domaine.id||"",
          competence_id:competenceIdOf(original),
          _source:entry.meta.fichier_sequence,
          _meta:entry.meta
        };
        sequences.push(seq);

        /* Séances explicitement déclarées dans data/index.json */
        for(const seaMeta of entry.meta.seances||[]){
          try{
            const rawSea=await fetchJSON(seaMeta.fichier);
            for(const originalSea of seanceList(rawSea)){
              seances.push({
                ...originalSea,
                id:originalSea.id||seaMeta.id,
                sequence_id:originalSea.sequence_id||seq.id,
                numero:originalSea.numero??seaMeta.numero,
                type:originalSea.type||seaMeta.type||"",
                titre:originalSea.titre||seaMeta.titre||"",
                classe:originalSea.classe||seq.classe||"",
                _source:seaMeta.fichier
              });
            }
          }catch(e){
            errors.push(`Séance ${seaMeta.fichier}: ${e.message}`);
          }
        }

        /* Séances éventuellement embarquées dans le JSON de séquence */
        for(const originalSea of seanceList(raw)){
          if(!originalSea.id)continue;
          if(!seances.some(s=>s.id===originalSea.id)){
            seances.push({
              ...originalSea,
              sequence_id:originalSea.sequence_id||seq.id,
              classe:originalSea.classe||seq.classe||""
            });
          }
        }
      }
    }catch(e){
      errors.push(`Séquence ${entry.meta.fichier_sequence}: ${e.message}`);
    }
  }));

  /* Déduplication robuste */
  state.sequences=dedupe(sequences);
  state.seances=dedupe(seances);

  /* Si une séance référence une séquence inexistante, on la rattache
     seulement si l'index permet de retrouver une correspondance. */
  state.seances=state.seances.filter(s=>state.sequences.some(q=>q.id===s.sequence_id));

  buildGraph();

  const n=state.sequences.length,s=state.seances.length,c=state.data.competences.length;
  $("subtitle").textContent=`${c} compétences · ${n} séquences · ${s} séances · prérequis et liens pédagogiques`;
  setStatus(`${c} compétences · ${n} séquences · ${s} séances`);
  $("loading").style.display="none";
  renderFilters();
  renderLegend();

  if(errors.length){
    console.warn("Certaines données n'ont pas pu être chargées :",errors);
    setStatus(`${c} compétences · ${n} séquences · ${s} séances · ${errors.length} fichier(s) ignoré(s)`);
  }
}

function dedupe(list){
  const map=new Map();
  list.forEach(x=>{if(x&&x.id)map.set(x.id,x)});
  return [...map.values()];
}

function setStatus(t){$("status").textContent=t}

/* =========================================================
   CARTOGRAPHIE
   ========================================================= */
function buildGraph(){
  const nodes=[],links=[];
  const compIds=new Set(state.data.competences.map(c=>c.id));

  /* Compétences */
  state.data.competences.forEach(c=>{
    const did=domainOf(c);
    nodes.push({
      id:"c:"+c.id,type:"competence",ref:c.id,
      label:c.intitule||c.nom||c.id,
      domaine:did,
      val:7
    });

    for(const p of c.prerequis_competences||c.prerequis||[]){
      const pid=typeof p==="string"?p:p.id;
      if(compIds.has(pid)){
        links.push({source:"c:"+pid,target:"c:"+c.id,type:"prereq"});
      }
    }
  });

  /* Séquences */
  state.sequences.forEach(seq=>{
    const cid=competenceIdOf(seq);
    const comp=getCompetence(cid);
    const did=domainOf(comp)||seq.domaine||"autre";

    nodes.push({
      id:"s:"+seq.id,type:"sequence",ref:seq.id,
      label:seq.titre||seq.id,domaine:did,val:4
    });

    if(comp){
      links.push({source:"c:"+comp.id,target:"s:"+seq.id,type:"sequence"});
    }

    /* Prérequis déclarés directement par la séquence */
    for(const p of seq.prerequis_competences||[]){
      const pid=typeof p==="string"?p:p.id;
      if(compIds.has(pid)){
        links.push({source:"c:"+pid,target:"s:"+seq.id,type:"prereq"});
      }
    }
  });

  /* Séances */
  state.seances.forEach(sea=>{
    const seq=state.sequences.find(s=>s.id===sea.sequence_id);
    if(!seq)return;
    nodes.push({
      id:"a:"+sea.id,type:"seance",ref:sea.id,
      label:`Séance ${sea.numero||""}${sea.titre?" — "+sea.titre:""}`,
      domaine:domainOf(getCompetence(competenceIdOf(seq)))||seq.domaine||"autre",
      val:2.2
    });
    links.push({source:"s:"+seq.id,target:"a:"+sea.id,type:"seance"});
  });

  state.nodes=nodes;
  state.links=links;
}

/* =========================================================
   FILTRES
   ========================================================= */
function renderFilters(){
  const wrap=$("domainFilters");
  wrap.innerHTML="";
  state.data.domaines.forEach(d=>{
    const b=document.createElement("button");
    b.className="chip "+(state.domains.has(d.id)?"active":"");
    b.innerHTML=`<span class="dot" style="background:${esc(d.couleur||"#888")}"></span> ${esc(d.nom||d.id)}`;
    b.onclick=()=>{
      if(state.domains.has(d.id))state.domains.delete(d.id);
      else state.domains.add(d.id);
      renderFilters();draw();
    };
    wrap.appendChild(b);
  });
}

function renderLegend(){
  $("legendRows").innerHTML=state.data.domaines.map(d=>
    `<div class="legend-row"><span class="dot" style="background:${esc(d.couleur||"#888")}"></span>${esc(d.nom||d.id)}</div>`
  ).join("");
}

$("search").addEventListener("input",e=>{
  state.search=e.target.value.trim().toLowerCase();
  draw();
});
$("reset").onclick=()=>{
  state.search="";
  $("search").value="";
  state.domains=new Set(state.data.domaines.map(d=>d.id));
  renderFilters();draw();
};

/* =========================================================
   AFFICHAGE 3D
   ========================================================= */
function visibleNode(n){
  if(!state.domains.has(n.domaine))return false;
  if(!state.search)return true;

  const q=state.search;
  const comp=n.type==="competence"?getCompetence(n.ref):null;
  const seq=n.type==="sequence"?state.sequences.find(s=>s.id===n.ref):null;
  const sea=n.type==="seance"?state.seances.find(s=>s.id===n.ref):null;

  const text=[
    n.label, n.ref,
    comp?.intitule,comp?.nom,
    seq?.titre,seq?.objectif_commun,
    sea?.titre,sea?.objectif_commun,sea?.type
  ].filter(Boolean).join(" ").toLowerCase();

  return text.includes(q);
}

function draw(){
  const visible=state.nodes.filter(visibleNode);
  const ids=new Set(visible.map(n=>n.id));

  /* Quand une recherche porte sur une séance ou une séquence,
     on conserve aussi ses parents afin de garder la lecture du réseau. */
  state.nodes.forEach(n=>{
    if(!visible.includes(n))return;
    if(n.type==="seance"){
      ids.add("s:"+state.seances.find(s=>s.id===n.ref)?.sequence_id);
    }
  });

  const nodes=state.nodes.filter(n=>ids.has(n.id));
  const links=state.links.filter(l=>{
    const a=typeof l.source==="object"?l.source.id:l.source;
    const b=typeof l.target==="object"?l.target.id:l.target;
    return ids.has(a)&&ids.has(b);
  });

  if(state.graph)state.graph.graphData({nodes,links});
  else{
    state.graph=ForceGraph3D()("#graph")
      .backgroundColor("rgba(0,0,0,0)")
      .showNavInfo(false)
      .nodeLabel(n=>nodeTooltip(n))
      .nodeColor(n=>nodeColor(n))
      .nodeVal(n=>n.val)
      .linkColor(l=>l.type==="prereq"?"#d9a441":"#718084")
      .linkOpacity(l=>l.type==="prereq"?.85:.45)
      .linkWidth(l=>l.type==="prereq"?1.8:.8)
      .linkDirectionalArrowLength(l=>l.type==="prereq"?5:2)
      .linkDirectionalArrowRelPos(1)
      .onNodeClick(n=>openNode(n))
      .onBackgroundClick(closePanel);
    state.graph.d3Force("charge").strength(-80);
    state.graph.d3Force("link").distance(l=>l.type==="prereq"?75:l.type==="sequence"?55:30);
    state.graph.graphData({nodes,links});
  }
}

function nodeColor(n){
  if(n.type==="seance")return "#91a6aa";
  const d=getDomain(n.domaine);
  return d.couleur||"#7f8c8d";
}

function nodeTooltip(n){
  const type=n.type==="competence"?"Compétence":n.type==="sequence"?"Séquence":"Séance";
  return `<b>${esc(type)}</b><br>${esc(n.label)}`;
}

/* =========================================================
   PANNEAU
   ========================================================= */
function openNode(n){
  if(n.type==="competence")openCompetence(n.ref);
  else if(n.type==="sequence")openSequence(n.ref);
  else openSeance(n.ref);
  $("panel").classList.add("open");
}

function openCompetence(id){
  const c=getCompetence(id);
  if(!c)return;

  const d=getDomain(domainOf(c));
  const sequences=state.sequences.filter(s=>competenceIdOf(s)===id);
  const prereqs=(c.prerequis_competences||c.prerequis||[])
    .map(p=>typeof p==="string"?getCompetence(p):getCompetence(p.id))
    .filter(Boolean);

  const relatedSeances=state.seances.filter(sea=>sequences.some(s=>s.id===sea.sequence_id));

  $("panelContent").innerHTML=`
    <span class="tag" style="border-color:${esc(d.couleur)};color:${esc(d.couleur)}">${esc(d.nom||d.id)}</span>
    <h2>${esc(c.intitule||c.nom||id)}</h2>
    <div class="stat-grid">
      <div class="stat"><b>${sequences.length}</b><span>séquence(s)</span></div>
      <div class="stat"><b>${relatedSeances.length}</b><span>séance(s)</span></div>
      <div class="stat"><b>${prereqs.length}</b><span>prérequis</span></div>
    </div>
    <h3>Objectifs du référentiel</h3>
    <ul>${(c.objectifs||[]).map(o=>`<li>${esc(o)}</li>`).join("")||"<li>Aucun objectif détaillé.</li>"}</ul>
    <h3>Prérequis</h3>
    ${prereqs.length?prereqs.map(p=>`
      <div class="item" data-comp="${esc(p.id)}">
        ${esc(p.intitule||p.nom||p.id)}
        <small>${esc(getDomain(domainOf(p)).nom||"")}</small>
      </div>`).join(""):"<p>Aucun prérequis déclaré.</p>"}
    <h3>Séquences liées</h3>
    ${sequences.length?sequences.map(s=>`
      <div class="item" data-seq="${esc(s.id)}">
        ${esc(s.titre||s.id)}
        <small>${esc(s.classe||s.niveau||"")} · ${esc(formatPeriode(s))}</small>
      </div>`).join(""):"<p>Aucune séquence liée.</p>"}
    <h3>Séances liées</h3>
    ${relatedSeances.length?relatedSeances.map(s=>`
      <div class="seance">
        <b>${esc(`Séance ${s.numero||""}${s.titre?" — "+s.titre:""}`)}</b>
        <small>${esc(s.type||"")} · ${esc(s.sequence_id||"")}</small>
      </div>`).join(""):"<p>Aucune séance.</p>"}
  `;
  bindPanelLinks();
}

function openSequence(id){
  const s=state.sequences.find(x=>x.id===id);
  if(!s)return;
  const c=getCompetence(competenceIdOf(s));
  const d=getDomain(domainOf(c)||s.domaine);
  const seas=state.seances.filter(x=>x.sequence_id===id);

  $("panelContent").innerHTML=`
    <span class="tag" style="border-color:${esc(d.couleur)};color:${esc(d.couleur)}">${esc(d.nom||d.id)}</span>
    <h2>${esc(s.titre||id)}</h2>
    <div class="stat-grid">
      <div class="stat"><b>${seas.length}</b><span>séance(s)</span></div>
      <div class="stat"><b>${s.periode??"—"}</b><span>période</span></div>
      <div class="stat"><b>${esc(s.classe||s.niveau||"—")}</b><span>niveau</span></div>
    </div>
    <h3>Compétence ciblée</h3>
    ${c?`<div class="item" data-comp="${esc(c.id)}">${esc(c.intitule||c.nom||c.id)}<small>${esc(d.nom||d.id)}</small></div>`:`<p>${esc(s.competence_id||"Non renseignée")}</p>`}
    <h3>Objectif commun</h3>
    <p>${esc(s.objectif_commun||s.objectif||"Aucun objectif renseigné.")}</p>
    <h3>Prérequis</h3>
    <p>${esc((s.prerequis||[]).join(" · ")||"Aucun prérequis textuel renseigné.")}</p>
    <h3>Séances</h3>
    ${seas.length?seas.map(sea=>`
      <div class="seance" data-sea="${esc(sea.id)}">
        <b>${esc(`Séance ${sea.numero||""}${sea.titre?" — "+sea.titre:""}`)}</b>
        <small>${esc(sea.type||"")} · ${esc(sea.objectif_commun||"")}</small>
      </div>`).join(""):"<p>Aucune séance chargée.</p>"}
    <h3>Source</h3>
    <p>${esc(s._source||"")}</p>
  `;
  bindPanelLinks();
}

function openSeance(id){
  const sea=state.seances.find(x=>x.id===id);
  if(!sea)return;
  const seq=state.sequences.find(x=>x.id===sea.sequence_id);

  $("panelContent").innerHTML=`
    <span class="tag">${esc(sea.type||"Séance")}</span>
    <h2>${esc(`Séance ${sea.numero||""}${sea.titre?" — "+sea.titre:""}`)}</h2>
    <h3>Séquence</h3>
    ${seq?`<div class="item" data-seq="${esc(seq.id)}">${esc(seq.titre)}<small>${esc(seq.classe||seq.niveau||"")}</small></div>`:"<p>Non rattachée.</p>"}
    <h3>Objectif</h3>
    <p>${esc(sea.objectif_commun||sea.objectif||"Aucun objectif renseigné.")}</p>
    ${sea.problematique?`<h3>Problématique</h3><p>${esc(sea.problematique)}</p>`:""}
    ${sea.competence_cible?`<h3>Compétence cible</h3><p>${esc(sea.competence_cible)}</p>`:""}
    ${sea.modalites_generales?`<h3>Modalités</h3><p>${esc(sea.modalites_generales)}</p>`:""}
    ${sea.vigilance?`<h3>Points de vigilance</h3><p>${esc(sea.vigilance)}</p>`:""}
    <h3>Source</h3><p>${esc(sea._source||"")}</p>
  `;
  bindPanelLinks();
}

function bindPanelLinks(){
  document.querySelectorAll("[data-comp]").forEach(el=>el.onclick=()=>{
    openCompetence(el.dataset.comp);$("panel").classList.add("open");
  });
  document.querySelectorAll("[data-seq]").forEach(el=>el.onclick=()=>{
    openSequence(el.dataset.seq);$("panel").classList.add("open");
  });
  document.querySelectorAll("[data-sea]").forEach(el=>el.onclick=()=>{
    openSeance(el.dataset.sea);$("panel").classList.add("open");
  });
}

function formatPeriode(s){
  if(s.semaine_debut&&s.semaine_fin)return`sem. ${s.semaine_debut}–${s.semaine_fin}`;
  return s.periode?`période ${s.periode}`:"";
}

function closePanel(){$("panel").classList.remove("open")}
$("close").onclick=closePanel;

/* =========================================================
   DÉMARRAGE
   ========================================================= */
(async()=>{
  try{
    await loadAll();
    draw();
  }catch(e){
    console.error(e);
    $("loading").innerHTML=`<div class="empty error"><b>Impossible de charger la cartographie.</b><br><br>${esc(e.message)}<br><br>Vérifiez que le fichier est placé dans la bonne partie du site et que <code>data/index.json</code> est accessible.</div>`;
    setStatus("Erreur de chargement");
  }
})();
</script>
