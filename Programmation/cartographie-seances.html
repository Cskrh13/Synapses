<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie des Séances — Synapses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F1;
    --text: #20242E;
    --text-soft: #5B5F6B;
    --accent: #2E5EAA;
    --border: #DEDBD2;
    --radius: 10px;
    --shadow: 0 10px 30px -14px rgba(30,42,74,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 24px;
    border-bottom: 1px solid var(--border);
    background: white;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--text);
    margin-bottom: 8px;
  }
  header p {
    font-size: 14px;
    color: var(--text-soft);
  }
  .controls {
    padding: 20px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  select, button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: white;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
  }
  button:hover {
    opacity: 0.9;
  }
  #graph-container {
    width: 100%;
    height: calc(100vh - 200px);
    background: white;
  }
  .node-info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: white;
    padding: 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    max-width: 300px;
    display: none;
  }
  .node-info h3 {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .node-info p {
    font-size: 13px;
    color: var(--text-soft);
    margin: 4px 0;
  }
  .node-info .tags {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .node-info .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 2px 6px;
    background: var(--bg);
    border-radius: 4px;
    color: var(--text-soft);
  }
  footer {
    padding: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>Cartographie des Séances</h1>
  <p>Visualisation des liens de prérequis entre les séances. Les flèches indiquent les dépendances.</p>
</header>

<div class="controls">
  <label>Filtrer par compétence :</label>
  <select id="competence-filter">
    <option value="all">Toutes les compétences</option>
    <!-- Les options seront générées dynamiquement -->
  </select>
  <button id="reset-zoom">Réinitialiser la vue</button>
</div>

<div id="graph-container"></div>

<div class="node-info" id="node-info">
  <h3 id="node-title">Sélectionnez une séance</h3>
  <p><strong>ID:</strong> <span id="node-id"></span></p>
  <p><strong>Compétence cœur:</strong> <span id="node-core"></span></p>
  <p><strong>Prérequis:</strong> <span id="node-prerequis"></span></p>
  <div class="tags">
    <span class="tag" id="node-tag-core"></span>
    <div id="node-tags-peripheriques"></div>
  </div>
</div>

<script src="https://unpkg.com/3d-force-graph@1"></script>
<script>
// Données des séances (à charger depuis vos fichiers JSON)
const SEANCES = [
  {
    id: "sea-lecture-cgp-01",
    titre: "Découverte des CGP simples",
    competence_coeur: "Lecture - CGP",
    competences_peripheriques: ["Oral - Écoute", "Vocabulaire"],
    prerequis: []
  },
  {
    id: "sea-lecture-cgp-02",
    titre: "Combinaison de CGP en syllabes",
    competence_coeur: "Lecture - CGP",
    competences_peripheriques: ["Écriture - Encoder", "Oral - Articulation"],
    prerequis: ["sea-lecture-cgp-01"]
  },
  {
    id: "sea-lecture-fluency-01",
    titre: "Fluence de lecture - Niveau 1",
    competence_coeur: "Lecture - Fluence",
    competences_peripheriques: ["Oral - Expression", "Compréhension"],
    prerequis: ["sea-lecture-cgp-02"]
  },
  {
    id: "sea-ecriture-01",
    titre: "Apprentissage de l'écriture cursive",
    competence_coeur: "Écriture - Cursive",
    competences_peripheriques: ["Motricité fine"],
    prerequis: []
  }
  // Ajoutez ici toutes vos séances avec leurs prérequis
];

// Couleurs par compétence cœur (à personnaliser)
const COMPETENCE_COLORS = {
  "Lecture - CGP": "#2E5EAA",
  "Lecture - Fluence": "#3A7BD5",
  "Écriture - Cursive": "#2A7F72",
  "Écriture - Encoder": "#2A9D8F",
  "Oral - Écoute": "#6B4E8E",
  "Oral - Expression": "#8A4E8E",
  "Vocabulaire": "#B5871E",
  "Compréhension": "#A56B2E"
};

// Initialisation du graphe
function initGraph(filter = 'all') {
  const filteredSeances = filter === 'all'
    ? SEANCES
    : SEANCES.filter(s => s.competence_coeur === filter);

  const nodes = filteredSeances.map(s => ({
    id: s.id,
    nom: s.titre,
    competence: s.competence_coeur,
    color: COMPETENCE_COLORS[s.competence_coeur] || "#888888"
  }));

  const links = [];
  filteredSeances.forEach(s => {
    s.prerequis.forEach(p => {
      if (filteredSeances.some(seance => seance.id === p)) {
        links.push({ source: p, target: s.id });
      }
    });
  });

  const graph = ForceGraph3D()(document.getElementById('graph-container'))
    .graphData({ nodes, links })
    .nodeLabel(n => n.nom)
    .nodeColor(n => n.color)
    .linkColor(() => "#999999")
    .linkWidth(1)
    .linkDirectionalArrowLength(4)
    .linkDirectionalArrowRelPos(1)
    .nodeVal(n => 10)
    .onNodeClick(n => showNodeInfo(n))
    .onBackgroundClick(() => hideNodeInfo());

  return graph;
}

// Afficher les infos d'un nœud
function showNodeInfo(node) {
  const seance = SEANCES.find(s => s.id === node.id);
  if (!seance) return;

  document.getElementById('node-title').textContent = seance.titre;
  document.getElementById('node-id').textContent = seance.id;
  document.getElementById('node-core').textContent = seance.competence_coeur;

  const prerequisText = seance.prerequis.length > 0
    ? seance.prerequis.join(', ')
    : "Aucun";
  document.getElementById('node-prerequis').textContent = prerequisText;

  document.getElementById('node-tag-core').textContent = seance.competence_coeur;
  document.getElementById('node-tag-core').style.backgroundColor =
    COMPETENCE_COLORS[seance.competence_coeur] || "#888888";
  document.getElementById('node-tag-core').style.color = "white";

  const peripheriquesTags = document.getElementById('node-tags-peripheriques');
  peripheriquesTags.innerHTML = seance.competences_peripheriques
    .map(c => `<span class="tag" style="background-color: ${COMPETENCE_COLORS[c] || '#888888'}; color: white;">${c}</span>`)
    .join('');

  document.getElementById('node-info').style.display = 'block';
}

function hideNodeInfo() {
  document.getElementById('node-info').style.display = 'none';
}

// Charger les options de filtre
function loadCompetenceFilters() {
  const filterSelect = document.getElementById('competence-filter');
  const competences = [...new Set(SEANCES.map(s => s.competence_coeur))];

  competences.forEach(c => {
    const option = document.createElement('option');
    option.value = c;
    option.textContent = c;
    filterSelect.appendChild(option);
  });

  filterSelect.addEventListener('change', (e) => {
    initGraph(e.target.value);
  });
}

// Réinitialiser la vue
document.getElementById('reset-zoom').addEventListener('click', () => {
  const graph = initGraph(document.getElementById('competence-filter').value);
  graph.cameraPosition({ x: 0, y: 0, z: 100 }, null, 1000);
});

// Initialisation
loadCompetenceFilters();
initGraph();
</script>

</body>
</html>
