<style>
:root{
  --navy:#1E2A4A; --navy-deep:#141d33; --bg:#F6F5F1; --panel:#FFFFFF; --panel-raised:#FAF9F5;
  --line:#DEDBD2; --ink:#20242E; --ink-soft:#5B5F6B; --accent-sky:#2E5EAA; --ring:#2E5EAA;
  --danger:#B5502E; --ok:#2A7F72; --radius:10px; --radius-sm:6px;
  --lecture:#B5502E; --ecriture:#2A7F72; --oral:#6B4E8E; --vocabulaire:#B5871E; --grammaire:#1E2A4A;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
button{cursor:pointer;font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-sky);font-weight:500;}
header.site-header{background:var(--navy);color:#fff;padding:14px 24px;border-bottom:3px solid var(--accent-sky);position:sticky;top:0;z-index:20;}
.header-top{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;}
.brand-mark{width:40px;height:40px;border-radius:8px;background:linear-gradient(160deg,var(--accent-sky),#5486d6);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:#fff;flex-shrink:0;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text .top{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#B9C6E5;font-family:'IBM Plex Mono',monospace;}
.brand-text .bottom{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
nav.main-nav{display:flex;gap:6px;flex-wrap:wrap;row-gap:6px;align-items:center;}
nav.main-nav a{color:#D9E0F2;text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:6px;transition:background .15s;white-space:nowrap;}
nav.main-nav a:hover{background:rgba(255,255,255,.09);color:#fff;}
nav.main-nav a.nav-programmation{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);margin-left:4px;color:#fff;}
nav.main-nav a.nav-programmation:hover{background:rgba(255,255,255,.18);}
nav.main-nav a.nav-programmation.active{background:var(--accent-sky);border-color:var(--accent-sky);}
main{max-width:1400px;margin:0 auto;padding:24px 24px 90px;}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.toolbar .chip-toggle{display:flex;gap:6px;flex-wrap:wrap;}
.toolbar .chip-toggle button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;}
.toolbar .chip-toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
/* =========================================================
   PLANNING HEBDOMADAIRE — AFFICHAGE
   ========================================================= */

/* Barre supérieure :
   les classes restent à gauche, la navigation des semaines est centrée. */
.toolbar{
  position:relative;
  display:block;
  width:100%;
  margin-bottom:18px;
}

.toolbar .chip-toggle{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  width:100%;
  padding-right:0;
}

.toolbar .chip-toggle button{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:20px;
  padding:6px 14px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
}

.toolbar .chip-toggle button.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

/* Navigation des semaines réellement centrée dans la page. */
.week-nav{
  position:static;
  transform:none;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.week-nav button{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:8px;
  padding:6px 12px;
  font-weight:700;
  min-width:38px;
}

.week-nav button:hover{
  background:var(--panel-raised);
}

.week-nav .label{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:var(--ink-soft);
  min-width:210px;
  text-align:center;
  white-space:nowrap;
}

.empty-state{
  background:var(--panel);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:32px;
  text-align:center;
  color:var(--ink-soft);
}

/* ---------------------------------------------------------
   SEMAINE
   ---------------------------------------------------------
   auto-fit + minmax :
   les journées restent lisibles et passent automatiquement
   à la ligne lorsque la largeur disponible devient insuffisante.
   --------------------------------------------------------- */

.week-grid{
  width:100%;
  max-width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));
  gap:14px;
  align-items:start;
}

.day-col{
  width:100%;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
  min-height:120px;
}

.day-col h3{
  font-size:15px;
  margin-bottom:2px;
}

.day-col .day-date{
  font-size:11.5px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
  margin-bottom:10px;
}

.day-col-head{
  display:block;
  text-decoration:none;
  color:inherit;
  border-radius:6px;
  margin:-4px -4px 6px;
  padding:4px;
}

.day-col-head:hover{
  background:var(--panel-raised);
}

.day-col-head .zoom-hint{
  font-size:11px;
  opacity:.55;
}

.day-body{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}

/* ---------------------------------------------------------
   LIGNE DE CRÉNEAUX
   --------------------------------------------------------- */

.creneaux-row{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  gap:8px;
  width:100%;
  max-width:100%;
}

/* Une brique indépendante.
   Elle peut prendre toute la largeur lorsqu'elle est seule. */
.creneau-card{
  flex:1 1 260px;
  min-width:0;
  max-width:100%;
  border-radius:8px;
  padding:8px 10px;
  margin:0;
  font-size:12.5px;
  border:1px solid var(--line);
  overflow-wrap:anywhere;
  word-break:normal;
}

/* Lorsqu'il existe plusieurs créneaux simultanés, ils deviennent
   naturellement des colonnes côte à côte. */
.creneaux-row.has-overlap .creneau-card{
  flex:1 1 calc(50% - 4px);
}

/* Si 3 créneaux sont simultanés, on permet 3 colonnes. */
.creneaux-row.has-overlap.many .creneau-card{
  flex-basis:calc(33.333% - 6px);
}

/* Brique partagée : une seule brique, avec les classes à l'intérieur. */
.creneau-commun{
  flex:1 1 100%;
  width:100%;
  max-width:100%;
  margin:0;
}

.creneau-card .classes-tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:5px;
}

.creneau-card .classes-tags span{
  font-size:9.5px;
  font-weight:700;
  padding:2px 7px;
  border-radius:20px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--ink-soft);
}

.creneau-card.seance{
  cursor:pointer;
  background:var(--panel-raised);
  border-left:4px solid var(--accent-sky);
}

.creneau-card.seance:hover{
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.creneau-card.seance.vide{
  border-left-color:var(--danger);
}

.creneau-card.recreation,
.creneau-card.pause,
.creneau-card.autre{
  background:#F1EFE9;
  color:var(--ink-soft);
  border-left:4px solid var(--ink-soft);
  font-style:italic;
}

.creneau-heure{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
}

.creneau-titre{
  font-weight:600;
  margin-top:1px;
  line-height:1.35;
}

.creneau-domaine{
  font-size:10.5px;
  color:var(--ink-soft);
  margin-top:2px;
}

/* ---------------------------------------------------------
   GROUPES DE CRÉNEAUX
   --------------------------------------------------------- */

.creneaux-sequence{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
}

.creneaux-sequence > .creneaux-row{
  width:100%;
}

/* ---------------------------------------------------------
   RESPONSIVE
   --------------------------------------------------------- */

@media (max-width:1100px){

  .week-grid{
    grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));
  }

  .toolbar .chip-toggle{
    padding-right:0;
    padding-bottom:48px;
  }

  .week-nav{
    top:auto;
    bottom:0;
    transform:translateX(-50%);
  }
}

@media (max-width:700px){

  main{
    padding:18px 12px 70px;
  }

  .toolbar{
    display:block;
  }

  .toolbar .chip-toggle{
    padding:0;
    width:100%;
    margin-bottom:12px;
  }

  .week-nav{
    position:static;
    transform:none;
    width:100%;
    justify-content:center;
  }

  .week-nav .label{
    min-width:0;
    font-size:11.5px;
  }

  .week-grid{
    grid-template-columns:1fr;
  }

  .creneaux-row.has-overlap .creneau-card,
  .creneaux-row.has-overlap.many .creneau-card{
    flex:1 1 100%;
  }
}
.day-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:120px;}
.day-col h3{font-size:14px;margin-bottom:2px;}
.day-col .day-date{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
.day-col-head{display:block;text-decoration:none;color:inherit;border-radius:6px;margin:-4px -4px 6px;padding:4px;}
.day-col-head:hover{background:var(--panel-raised);}
.day-col-head .zoom-hint{font-size:11px;opacity:.55;}
.day-body{display:flex;flex-direction:column;gap:8px;}
.creneau-commun{margin-bottom:2px;}
.classes-row{display:flex;gap:8px;align-items:flex-start;}
.niveau-group{flex:1;min-width:0;}
.niveau-group .niveau-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
.creneau-card{border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12.5px;border:1px solid var(--line);}

.creneau-card .classes-tags span{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);}

.creneau-card.recreation,.creneau-card.pause,.creneau-card.autre{background:#F1EFE9;color:var(--ink-soft);border-left:4px solid var(--ink-soft);font-style:italic;}
.creneau-heure{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}

/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,29,51,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}

.drawer-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.drawer-crumb{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent-sky);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.drawer-close{background:var(--panel-raised);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:16px;flex-shrink:0;}
.drawer-body{padding:22px;}
.drawer-body h2{font-size:20px;margin-bottom:10px;}
.drawer-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.drawer-meta span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--panel-raised);border:1px solid var(--line);}
.drawer-block{margin-bottom:16px;}
.drawer-block h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;}
.drawer-block p{margin:0;font-size:14px;}
table.deroule{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
table.deroule th{text-align:left;background:var(--panel-raised);padding:6px 8px;font-size:11px;text-transform:uppercase;color:var(--ink-soft);}
table.deroule td{padding:8px;border-top:1px solid var(--line);vertical-align:top;}
.drawer-manual{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.drawer-manual select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13.5px;}
.drawer-manual .btn{margin-top:8px;border:1px solid var(--accent-sky);background:var(--accent-sky);color:#fff;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;}
.nav-index-link{margin-right:auto;font-weight:700;}


.synapses-footer {
    margin-top: 40px;
    padding: 18px 24px;
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
}
.synapses-footer div:first-child {
    font-weight: 600;
    letter-spacing: .04em;
}
</style>

<script>
/* =========================================================
   SYNAPSES — AUTHOR MARKER
   Project: Grand Planificateur pédagogique
   Author: Cskrh13 / Vincent
   Copyright: © 2026
   Version: 0.9.0-test
   Build: 2026-08-27
   ========================================================= */

const SYNAPSES_BUILD = {
    project: "Synapses",
    author: "Cskrh13",
    year: 2026,
    version: "0.9.0-test",
    build: "2026-08-27"
};

"use strict";
const PC = window.PlanningCore;

/*
 * Coffre Synapses — lecture locale uniquement.
 * Le contenu réel provient exclusivement du fichier .synapses ouvert par
 * l'utilisateur. Aucun élève, besoin, objectif ou autre donnée individuelle
 * n'est créé ici et rien n'est placé dans localStorage.
 */
let coffre = null;
try { coffre = new SynapsesCoffre.Coffre(); } catch (e) { coffre = null; }
function coffreDisponible(){ return !!coffre; }
function coffreOuvert(){ return !!(coffre && coffre.ouvert); }
function lireElevesDuCoffre(){
  return coffreOuvert() ? coffre.listerEleves() : [];
}

const $ = id => document.getElementById(id);

let config = PC.chargerConfig();
let grilles = PC.chargerGrilles();
let affectations = PC.chargerAffectations();
let banque = {};
let semaines = [];
let semaineIdx = 0;
let classesAffichees = []; // ids de classes et/ou de dispositifs
let selectionInitialisee = false; // évite de re-cocher le dispositif après un décochage manuel

function couleurDomaine(cle){
  let hash=0; const s=String(cle||"");
  for(let i=0;i<s.length;i++) hash=(hash*31+s.charCodeAt(i))>>>0;
  const palette=["#B5502E","#2A7F72","#6B4E8E","#B5871E","#7A4A9E","#2E5EAA","#B23A5C","#3F8C4B","#8C5E2A","#4C6E91"];
  return palette[hash%palette.length];
}

function elementById(id){
  return PC.classeById(config, id) || PC.dispositifById(config, id);
}

function renderClassesToggle(){
  const wrap = $("classes-affichees");
  wrap.innerHTML = "";
  const classes = config.classes || [];
  const dispositifs = config.dispositifs || [];

  // Sélection par défaut, à la première initialisation seulement : les
  // classes sont toutes décochées, seul(s) le(s) dispositif(s) sont cochés.
  // Un décochage manuel par l'utilisateur ne doit jamais être réécrasé.
  if(!selectionInitialisee){
    classesAffichees = dispositifs.map(d=>d.id);
    selectionInitialisee = true;
  }

  const rendreChip = (item)=>{
    const b = document.createElement("button");
    b.textContent = item.nom;
    b.className = classesAffichees.includes(item.id) ? "active" : "";
    b.addEventListener("click", ()=>{
      const i = classesAffichees.indexOf(item.id);
      if(i>=0) classesAffichees.splice(i,1); else classesAffichees.push(item.id);
      renderClassesToggle();
      renderSemaine();
    });
    wrap.appendChild(b);
  };

  classes.forEach(rendreChip);

  if(dispositifs.length){
    if(classes.length){
      const sep = document.createElement("span");
      sep.className = "hint";
      sep.style.margin = "0 4px";
      sep.textContent = "·";
      wrap.appendChild(sep);
    }
    dispositifs.forEach(rendreChip);
  }

  if(!classes.length && !dispositifs.length){
    wrap.innerHTML = '<span class="hint">Aucune classe ni dispositif créé — rendez-vous sur « Planning — Gestion ».</span>';
  }
}

function renderWeekNav(){
  const sem = semaines[semaineIdx];
  $("week-label").textContent = sem ? `Semaine ${sem.numero} — ${PC.formatDateShort(sem.lundi)} au ${PC.formatDateShort(sem.vendredi)}` : "—";
}

function itemPourCle(classeNiveau, domaineCle, seanceId){
  const bucket = banque[classeNiveau] && banque[classeNiveau][domaineCle];
  if(!bucket) return null;
  return bucket.items.find(it=>it.id===seanceId) || null;
}

/** Clé de "signature" d'un créneau, indépendante de la classe — sert à
 *  détecter les services communs (récréations/pauses à l'échelle de
 *  l'école) partagés à l'identique par toutes les classes affichées. */
function signatureCreneau(c){
  return c.debut + "|" + c.fin + "|" + c.type + "|" + (c.type === "seance" ? "" : (c.libelle || c.type));
}
function renderSemaine(){

  renderWeekNav();

  const content = $("content");
  content.innerHTML = "";

  const sem = semaines[semaineIdx];

  if(!sem){
    content.innerHTML =
      '<div class="empty-state">' +
      'Aucune configuration de rentrée / semaines n\'est encore définie. ' +
      'Rendez-vous sur la page « Planning — Gestion ».' +
      '</div>';
    return;
  }

  if(!classesAffichees.length){
    content.innerHTML =
      '<div class="empty-state">' +
      'Sélectionnez au moins une classe à afficher.' +
      '</div>';
    return;
  }

  const classesObjs =
    classesAffichees
      .map(id => elementById(id))
      .filter(Boolean);

  const grid = document.createElement("div");
  grid.className = "week-grid";


  /* =========================================================
     UNE JOURNÉE
     ========================================================= */

  PC.JOURS.forEach(j => {

    const jourDate =
      PC.addDays(
        sem.lundi,
        j.n - 1
      );

    const iso =
      PC.dateISO(jourDate);

    const col =
      document.createElement("div");

    col.className = "day-col";

    col.innerHTML = `
      <a
        class="day-col-head"
        href="planning-jour.html?date=${iso}"
        title="Ouvrir le cahier journal de ce jour"
      >
        <h3>
          ${j.nom}
          <span class="zoom-hint">🔍</span>
        </h3>

        <div class="day-date">
          ${PC.formatDateShort(jourDate)}
        </div>
      </a>
    `;


    const body =
      document.createElement("div");

    body.className = "day-body";


    /* =======================================================
       RÉCUPÉRATION DES CRÉNEAUX
       ======================================================= */

    const tousLesCreneaux = [];

    classesObjs.forEach(cl => {

      const grille =
        (grilles[cl.id] || [])
          .filter(c => c.jour === j.n)
          .map(c => ({
            creneau: c,
            classe: cl
          }));

      grille.forEach(x =>
        tousLesCreneaux.push(x)
      );

    });


    /* =======================================================
       FUSION DES CRÉNEAUX PARTAGÉS
       =======================================================
       Deux créneaux sont partagés lorsqu'ils ont exactement
       le même horaire, le même type et le même libellé.

       IMPORTANT :
       On ne fusionne pas les séances : deux classes peuvent
       avoir une séance différente dans le même créneau.
       ======================================================= */

    const groupes = new Map();

    tousLesCreneaux.forEach(({creneau,classe}) => {

      const partageable =
        creneau.type !== "seance";

      const cle =
        partageable
          ? signatureCreneau(creneau)
          : (
              "seance|" +
              classe.id +
              "|" +
              creneau.id
            );

      if(!groupes.has(cle)){
        groupes.set(cle,{
          creneau: creneau,
          classes: [],
          membres: []
        });
      }

      const groupe =
        groupes.get(cle);

      groupe.membres.push({
        creneau,
        classe
      });

      if(!groupe.classes.some(
        cl => cl.id === classe.id
      )){
        groupe.classes.push(classe);
      }

    });


    /* =======================================================
       CRÉATION DES GROUPES D'AFFICHAGE
       ======================================================= */

    const blocs =
      Array.from(groupes.values())
        .sort((a,b) =>
          PC.heureVersMin(a.creneau.debut) -
          PC.heureVersMin(b.creneau.debut)
        );


    /* =======================================================
       REGROUPEMENT PAR CHEVAUCHEMENT
       =======================================================
       Les créneaux qui se chevauchent sont placés dans la même
       rangée et deviennent donc des briques côte à côte.

       Les créneaux qui ne se chevauchent pas restent dans des
       rangées indépendantes.
       ======================================================= */

    const ranges = [];

    blocs.forEach(bloc => {

      const debut =
        PC.heureVersMin(
          bloc.creneau.debut
        );

      const fin =
        PC.heureVersMin(
          bloc.creneau.fin
        );

      let rangee = null;

      for(let i=0; i<ranges.length; i++){

        const derniereFin =
          Math.max(
            ...ranges[i].map(x =>
              PC.heureVersMin(
                x.creneau.fin
              )
            )
          );

        if(debut < derniereFin){

          rangee = ranges[i];
          break;

        }

      }

      if(!rangee){

        rangee = [];
        ranges.push(rangee);

      }

      rangee.push(bloc);

    });


    /* =======================================================
       AFFICHAGE DES RANGÉES
       ======================================================= */

    const sequence =
      document.createElement("div");

    sequence.className =
      "creneaux-sequence";


    ranges.forEach(rangee => {

      const row =
        document.createElement("div");

      row.className =
        "creneaux-row";


      if(rangee.length > 1){

        row.classList.add(
          "has-overlap"
        );

        if(rangee.length >= 3){

          row.classList.add(
            "many"
          );

        }

      }


      rangee.forEach(bloc => {

        const c =
          bloc.creneau;

        const carte =
          document.createElement("div");


        /* =================================================
           CRÉNEAU PARTAGÉ
           ================================================= */

        if(
          c.type !== "seance" &&
          bloc.classes.length > 1
        ){

          carte.className =
            "creneau-card creneau-commun " +
            c.type;

          carte.innerHTML = `
            <div class="creneau-heure">
              ${c.debut}–${c.fin}
            </div>

            <div class="creneau-titre">
              ${
                (c.libelle && c.libelle.trim())
                  ? c.libelle
                  : PC.TYPES_CRENEAU[c.type].label
              }
            </div>

            <div class="classes-tags">
              ${
                bloc.classes
                  .map(cl =>
                    `<span>${cl.nom}</span>`
                  )
                  .join("")
              }
            </div>
          `;

        }


        /* =================================================
           CRÉNEAU SIMPLE
           ================================================= */

        else {

          const membre =
            bloc.membres[0];

          const cl =
            membre.classe;

          const creneau =
            membre.creneau;


          if(creneau.type === "seance" && !cl.niveau){

            // Créneau "séance" d'un dispositif (ULIS, etc.) : pas de niveau,
            // pas de banque de séances — le titre est celui saisi sur la
            // grille du dispositif, en lecture seule dans cette vue de
            // comparaison.

            carte.className = "creneau-card seance";

            carte.style.borderLeftColor =
              couleurDomaine(creneau.domaineCle || cl.id);

            carte.innerHTML = `
              <div class="creneau-heure">
                ${creneau.debut}–${creneau.fin}
              </div>

              <div class="creneau-titre">
                ${
                  (creneau.titre && creneau.titre.trim())
                    ? creneau.titre
                    : cl.nom
                }
              </div>

              <div class="classes-tags">
                <span>${cl.nom}</span>
              </div>
            `;

          }

          else if(creneau.type === "seance"){

            const aff =
              (affectations[cl.id] || {})[
                PC.cleCreneau(
                  iso,
                  creneau.id
                )
              ];

            const item =
              aff && aff.seanceId
                ? itemPourCle(
                    cl.niveau,
                    creneau.domaineCle,
                    aff.seanceId
                  )
                : null;


            carte.className =
              "creneau-card seance" +
              (item ? "" : " vide");


            const domaineLabel =
              (
                banque[cl.niveau] &&
                banque[cl.niveau][
                  creneau.domaineCle
                ]
              )
                ? banque[cl.niveau][
                    creneau.domaineCle
                  ].label
                : creneau.domaineCle;


            carte.style.borderLeftColor =
              couleurDomaine(
                creneau.domaineCle
              );


            carte.innerHTML = `
              <div class="creneau-heure">
                ${creneau.debut}–${creneau.fin}
              </div>

              <div class="creneau-titre">
                ${
                  item
                    ? (
                        item.titre ||
                        item.type ||
                        "Séance"
                      )
                    : "— aucune séance disponible"
                }
              </div>

              <div class="creneau-domaine">
                ${domaineLabel}
                ${
                  item && item.numero
                    ? " · n°" + item.numero
                    : ""
                }
              </div>

              <div class="classes-tags">
                <span>${cl.nom}</span>
              </div>
            `;


            carte.addEventListener(
              "click",
              () =>
                ouvrirDrawer(
                  cl.id,
                  iso,
                  creneau,
                  item
                )
            );

          }


          /* ===============================================
             AUTRE / RÉCRÉATION / PAUSE
             =============================================== */

          else {

            carte.className =
              "creneau-card " +
              creneau.type;


            carte.innerHTML = `
              <div class="creneau-heure">
                ${creneau.debut}–${creneau.fin}
              </div>

              <div class="creneau-titre">
                ${
                  (
                    creneau.libelle &&
                    creneau.libelle.trim()
                  )
                    ? creneau.libelle
                    : PC.TYPES_CRENEAU[
                        creneau.type
                      ].label
                }
              </div>

              <div class="classes-tags">
                <span>${cl.nom}</span>
              </div>
            `;

          }

        }


        row.appendChild(carte);

      });


      sequence.appendChild(row);

    });


    if(sequence.children.length){

      body.appendChild(
        sequence
      );

    }
    else {

      body.innerHTML =
        '<div class="empty-state" style="padding:18px;">' +
        'Aucun créneau pour cette journée.' +
        '</div>';

    }


    col.appendChild(body);
    grid.appendChild(col);

  });


  content.appendChild(grid);

}

/* ---------------- Drawer : déroulé de séance ---------------- */
async function ouvrirDrawer(classeId, iso, creneau, itemResume){
  const cl = PC.classeById(config, classeId);
  const overlay = $("drawerOverlay"), drawer = $("drawer"), body = $("drawerBody");
  overlay.classList.add("open"); drawer.classList.add("open");
  $("drawerCrumb").textContent = `${cl.nom} · ${PC.formatDateLong(PC.parseISO(iso))} · ${creneau.debut}–${creneau.fin}`;
  body.innerHTML = '<p style="color:var(--ink-soft);">Chargement du déroulé…</p>';

  const domaineLabel = (banque[cl.niveau] && banque[cl.niveau][creneau.domaineCle]) ? banque[cl.niveau][creneau.domaineCle].label : creneau.domaineCle;

  if(!itemResume){
    renderDrawerVide(classeId, iso, creneau, domaineLabel);
    return;
  }
  try{
    const item = await PC.chargerDerouleDeItem(itemResume);
    renderDrawerSeance(classeId, iso, creneau, domaineLabel, item);
  }catch(e){
    body.innerHTML = `<p style="color:var(--danger);">Impossible de charger le déroulé (${e.message}).</p>`;
  }
}

function fermerDrawer(){
  $("drawerOverlay").classList.remove("open");
  $("drawer").classList.remove("open");
}
$("drawerClose").addEventListener("click", fermerDrawer);
$("drawerOverlay").addEventListener("click", fermerDrawer);

function renderDrawerSeance(classeId, iso, creneau, domaineLabel, item){
  const cl = PC.classeById(config, classeId);
  const body = $("drawerBody");
  const phases = (item.deroule||[]).map(p=>`
    <tr>
      <td><b>${p.phase||""}</b><br><span style="color:var(--ink-soft);font-size:11.5px;">${p.temps||""}</span></td>
      <td>${p.modalite_materiel||""}</td>
      <td>${p.deroulement||""}</td>
      <td>${p.amenagement||""}</td>
    </tr>`).join("");
  body.innerHTML = `
    <h2>${item.titre || "Séance"}</h2>
    <div class="drawer-meta">
      <span>${cl.nom}</span><span>${domaineLabel}</span>${item.numero?`<span>N° ${item.numero}</span>`:""}${item.type?`<span>${item.type}</span>`:""}
    </div>
    ${item.objectif_commun?`<div class="drawer-block"><h4>Objectif</h4><p>${item.objectif_commun}</p></div>`:""}
    ${item.problematique?`<div class="drawer-block"><h4>Problématique</h4><p>${item.problematique}</p></div>`:""}
    ${item.competence_cible?`<div class="drawer-block"><h4>Compétence ciblée</h4><p>${item.competence_cible}</p></div>`:""}
    <div class="drawer-block">
      <h4>Déroulé</h4>
      <table class="deroule"><thead><tr><th>Phase</th><th>Modalité / matériel</th><th>Déroulement</th><th>Aménagement</th></tr></thead>
      <tbody>${phases || '<tr><td colspan="4" style="color:var(--ink-soft);">Aucun déroulé renseigné.</td></tr>'}</tbody></table>
    </div>
    ${renderChoixManuel(classeId, iso, creneau)}
  `;
  brancherChoixManuel(classeId, iso, creneau);
}

function renderDrawerVide(classeId, iso, creneau, domaineLabel){
  const cl = PC.classeById(config, classeId);
  const body = $("drawerBody");
  body.innerHTML = `
    <h2>Créneau libre</h2>
    <div class="drawer-meta"><span>${cl.nom}</span><span>${domaineLabel}</span></div>
    <p style="color:var(--ink-soft);">Aucune séance disponible dans ce domaine n'a pu être affectée automatiquement (banque épuisée). Choisissez-en une manuellement, ou ajoutez de nouvelles séances dans « Séquences &amp; séances ».</p>
    ${renderChoixManuel(classeId, iso, creneau)}
  `;
  brancherChoixManuel(classeId, iso, creneau);
}

function renderChoixManuel(classeId, iso, creneau){
  const cl = PC.classeById(config, classeId);
  const bucket = banque[cl.niveau] && banque[cl.niveau][creneau.domaineCle];
  const options = bucket ? bucket.items.map(it=>`<option value="${it.id}">${it.titre||it.type||it.id} (n°${it.numero||"?"})</option>`).join("") : "";
  return `
    <div class="drawer-manual">
      <h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;">Affecter une autre séance à ce créneau</h4>
      <select id="choix-manuel"><option value="">— Choisir une séance —</option>${options}</select>
      <button class="btn" id="btn-affecter-manuel">Affecter</button>
    </div>`;
}
function brancherChoixManuel(classeId, iso, creneau){
  const btn = $("btn-affecter-manuel");
  if(!btn) return;
  btn.addEventListener("click", ()=>{
    const cl = PC.classeById(config, classeId);
    const sel = $("choix-manuel");
    const id = sel.value;
    if(!id) return;
    const bucket = banque[cl.niveau] && banque[cl.niveau][creneau.domaineCle];
    const item = bucket.items.find(it=>it.id===id);
    affectations[classeId] = affectations[classeId] || {};
    affectations[classeId][PC.cleCreneau(iso, creneau.id)] = {
      seanceId: id, source: item.source, fichier: item.fichier || null, domaineCle: creneau.domaineCle, manuel: true
    };
    PC.sauverAffectations(affectations);
    fermerDrawer();
    renderSemaine();
  });
}

/* ---------------- Navigation semaines ---------------- */
$("prev-week").addEventListener("click", ()=>{ if(semaineIdx>0){ semaineIdx--; renderSemaine(); } });
$("next-week").addEventListener("click", ()=>{ if(semaineIdx<semaines.length-1){ semaineIdx++; renderSemaine(); } });

// Si la configuration, les grilles ou les affectations changent dans un
// autre onglet (Planning — Gestion), on relit tout et on réaffiche —
// fluidité entre les pages du planning, sans jamais perdre les affectations
// manuelles (déjà protégées par le flag "manuel" côté planning-core.js).
window.addEventListener("storage", (e)=>{
  if([PC.STORE_CONFIG, PC.STORE_GRILLES, PC.STORE_AFFECT].includes(e.key)){
    config = PC.chargerConfig();
    grilles = PC.chargerGrilles();
    affectations = PC.chargerAffectations();
    semaines = PC.calculerSemaines(config);
    if(semaineIdx >= semaines.length) semaineIdx = Math.max(0, semaines.length-1);
    renderClassesToggle();
    renderSemaine();
  }
});

/* ---------------- Initialisation ---------------- */
(async function init(){
  semaines = PC.calculerSemaines(config);
  renderClassesToggle();
  try{
    banque = await PC.chargerBanque();
  }catch(e){ /* le planning reste affichable, sans détail de séance */ }
  renderSemaine();
})();

</script>
